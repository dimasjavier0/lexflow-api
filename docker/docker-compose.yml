services:
  postgres:
    image: postgres:17-alpine
    container_name: lexflow-postgres
    environment:
      POSTGRES_DB: lexflow
      POSTGRES_USER: lexflow
      POSTGRES_PASSWORD: lexflow
    ports:
      - "5433:5432"
    volumes:
      - lexflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexflow -d lexflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lexflow_postgres_data:
